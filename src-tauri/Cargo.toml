[package]
name = "bulk-uninstaller"
version = "0.1.2"
description = "Uninstall a Program (Bulk Edition) — uninstall a program, or many at once, on Windows"
authors = ["Taylor Ivanoff"]
edition = "2021"

[lib]
name = "bulk_uninstaller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-tray-base = { path = "../../tauri-tray-base" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
